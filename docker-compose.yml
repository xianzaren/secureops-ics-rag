services:
  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - rag-index:/app/chroma_db
      - rag-uploads:/app/data/uploads
      - model-cache:/root/.cache/huggingface
      - ./reports:/app/reports

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  rag-index:
  rag-uploads:
  model-cache:
